<!DOCTYPE html>
<html lang="en" data-page="signup">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css/signupstyles.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR
                        DECISIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1"
                        href="contact-us.html">Contact Us</a>
                    <a class="nav-link nav-button1" href="items.html">Items</a>
                    <a class="nav-link nav-button1"
                        href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                </div>
               
            </nav>
        </header>
        <div class="login-page">
            <form action="#" method="post">
                <fieldset id="login">
                    <div class="login-signup-nav">
                        <a id="currentPage" href="login.html">
                            <h1>Login</h1>
                        </a>
                        <h1> / </h1>
                        <a href="signup.html">
                            <h1>Sign Up</h1>
                        </a>
                    </div>
                    <hr class="login-hr"><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="first-name" class="login-label">First
                                Name</label><br>
                            <input type="text" id="first-name" name="first-name"
                                placeholder="First Name" required
                                class="login-input">
                        </div>
                        <div class="form-group">
                            <label for="last-name" class="login-label">Last
                                Name</label><br>
                            <input type="text" id="last-name" name="last-name"
                                placeholder="Last Name" required
                                class="login-input">
                        </div>
                    </div><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email"
                                class="login-label">Email</label><br>
                            <input type="email" id="email" name="email"
                                placeholder="example@gmail.com" required
                                class="login-input">
                        </div>
                        <div class="form-group">
                            <label for="confirm-email"
                                class="login-label">Confirm Email</label><br>
                            <input type="email" id="confirm-email"
                                name="confirm-email"
                                placeholder="example@gmail.com" required
                                class="login-input">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="password"
                                class="login-label">Password:</label><br>
                            <input type="password" id="password" name="password"
                                placeholder="Password" required
                                class="login-input">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password"
                                class="login-label">Confirm
                                Password:</label><br>
                            <input type="password" id="confirm-password"
                                name="confirm-password"
                                placeholder="Confirm Password" required
                                class="login-input">
                        </div>
                    </div><br><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone"
                                class="login-label">Phone</label><br>
                            <input type="tel" id="phone" name="phone"
                                placeholder="1234567890 " required
                                class="login-input"><br><br>
                        </div>
                        <div class="form-group">
                            <label for="dob" class="login-label">Date of
                                Birth</label> <br>
                            <input type="text" id="dob" name="dob"
                                placeholder="YYYY-MM-DD" required
                                class="login-input"><br><br>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="address"
                                class="login-label">Address</label><br>
                            <input type="text" id="address" name="address"
                                placeholder="Street Address" required
                                class="login-input"><br><br>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="country"
                                class="login-label">Country:</label><br>
                            <input type="text" id="country" name="country"
                                placeholder="Country" required
                                class="login-input">
                        </div>
                        <div class="form-group">
                            <label for="region"
                                class="login-label">Region:</label><br>
                            <input type="text" id="region" name="region"
                                placeholder="Region" required
                                class="login-input">
                        </div>
                    </div><br>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city"
                                class="login-label">City:</label><br>
                            <input type="text" id="city" name="city"
                                placeholder="City" required class="login-input">
                        </div>
                        <div class="form-group">
                            <label for="postal-code" class="login-label">Postal
                                Code:</label><br>
                            <input type="text" id="postal-code"
                                name="postal-code" placeholder="1H1H1H" required
                                class="login-input">
                        </div>
                    </div>
                    <br>
                    
                    <br>
                    <button type="submit" class="login-button">Login</button>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
