<!DOCTYPE html>
<html lang="en" data-page="signup">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    
    <link rel="stylesheet" href="css/signupstyles.css">
    <link rel="stylesheet" href="css/styles.css">

   

</head>

<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR
                        DECISIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1" href="contact-us.html">Contact Us</a>
                    <a class="nav-link nav-button1" href="items.html">Items</a>
                    <a class="nav-link nav-button1" href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                    <a class="nav-link nav-button1" href="map.html">Map</a>
                </div>

            </nav>
        </header>
        <div class="login-div">
            <div class="login-page">



                <form action="" id="frmRegistration">
                    <div class="login-signup-nav">
                        <a href="login.html">
                            <h1>Login</h1>
                        </a>
                        <h1> / </h1>
                        <a id="currentPage" href="signup.html">
                            <h1>Sign Up</h1>
                        </a>
                    </div>
                    <hr class="login-hr">

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <input type="text" id="first-name" name="first-name" required class="login-input">
                            <label for="first-name" class="login-label">First Name</label>
                        </div>
                        <div class="form-group inputbox">
                            <input type="text" id="last-name" name="last-name" required class="login-input">
                            <label for="last-name" class="login-label">Last Name</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <input type="email" id="email" name="email" required class="login-input">
                            <label for="email" class="login-label">Email</label>
                        </div>
                        <div class="form-group inputbox">
                            <input type="email" id="confirm-email" name="confirm-email" required class="login-input">
                            <label for="confirm-email" class="login-label">Confirm Email</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <input type="password" id="password" name="password" required class="login-input">
                            <label for="password" class="login-label">Password</label>
                        </div>
                        <div class="form-group inputbox">
                            <input type="password" id="confirm-password" name="confirm-password" required class="login-input">
                            <label for="confirm-password" class="login-label">Confirm Password</label>
                        </div>
                    </div>

                    <div class="form-row" style="width: 100%; justify-content: flex-start;">
                        <div class="form-group inputbox" style="width: 100%;">
                            <input type="text" id="address" name="address" required class="login-input">
                            <label for="address" class="login-label">Street Address</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <input type="tel" id="phone" name="phone" required class="login-input">
                            <label for="phone" class="login-label">Phone</label>
                        </div>
                        <div class="form-group inputbox">
                            <input type="date" id="dob" name="dob" required class="login-input">
                            <label for="dob" class="login-label">Date of Birth</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <select id="country" name="country" required class="login-input">
                                <option value="" disabled selected hidden></option>
                                <option value="CA">Canada</option>
                            </select>
                            <label for="country" class="login-label">Country</label>
                        </div>
                        <div class="form-group inputbox">
                            <select id="region" name="region" required class="login-input">
                                <option value="" disabled selected hidden></option>
                                <option value="AB">Alberta</option>
                                <option value="BC">British Columbia</option>
                                <option value="MB">Manitoba</option>
                                <option value="NB">New Brunswick</option>
                                <option value="NL">Newfoundland and Labrador</option>
                                <option value="NS">Nova Scotia</option>
                                <option value="ON">Ontario</option>
                                <option value="PE">Prince Edward Island</option>
                                <option value="QC">Quebec</option>
                                <option value="SK">Saskatchewan</option>
                                <option value="NT">Northwest Territories</option>
                                <option value="NU">Nunavut</option>
                                <option value="YT">Yukon</option>
                            </select>
                            <label for="region" class="login-label">Province</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group inputbox">
                            <input type="text" id="city" name="city" required class="login-input">
                            <label for="city" class="login-label">City</label>
                        </div>
                        <div class="form-group inputbox">
                            <input type="text" id="postal-code" name="postal-code" required class="login-input">
                            <label for="postal-code" class="login-label">Postal Code</label>
                        </div>
                    </div>
                    <div class="buttons">
                        <button type="reset">Clear</button>
                        <button type="submit">Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/validation.js"></script>
    <!-- since the date input has automatic placeholder, i have to get rid of it then add it once the field is filled -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
          const dateInput = document.querySelector('input[type="date"]');
        
          function toggleEmptyClass() {
            if (!dateInput.value) {
              dateInput.classList.add('empty');
            } else {
              dateInput.classList.remove('empty');
            }
          }
        
          // Initial check
          toggleEmptyClass();
        
          // Listen for input changes
          dateInput.addEventListener('input', toggleEmptyClass);
        });
        </script>
         <script type="module">
            import { BackgroundSlider } from './js/modules/backgroundImage.js';
        
            const images = [
                'data/images/login2.jpg',
                'data/images/login1.jpg',
                'data/images/login9.jpg',
                'data/images/login4.jpg',
                'data/images/login5.jpg',
    
            ];
        
            BackgroundSlider(images, 3000);
        </script>
</body>

</html>
