<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/loginstyles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR
                        DECITIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1"
                        href="contact-us.html">Contact Us</a>
                    <a class="nav-link nav-button1" href="items.html">Items</a>
                    <a class="nav-link nav-button1"
                        href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                </div>
                <div class="login-signup">
                    <a class="nav-link nav-button2 current-page"
                        href="login.html">Login</a>
                    <a class="nav-link nav-button2" href="signup.html">Sign
                        Up</a>
                </div>
            </nav>
        </header>
        <div class="login-page">
            <form action="#" method="post">
                <fieldset id="login">
                    <div class="login-signup-nav">
                        <a id="currentPage" href="login.html">
                            <h1>Login</h1>
                        </a>
                        <h1> / </h1>
                        <a href="signup.html">
                            <h1>Sign Up</h1>
                        </a>
                    </div>
                    <hr class="login-hr"><br>
                    <label for="email" class="login-label">Email:</label><br>
                    <input type="email" id="email" name="email" required
                        class="login-input"><br><br>
                    <label for="password"
                        class="login-label">Password:</label><br>
                    <input type="password" id="password" name="password"
                        required class="login-input"><br><br>
                    <input type="checkbox" id="remember-me" name="remember-me"
                        class="login-checkbox">Remember me<br><br>
                    <button type="submit" class="login-button">Login</button>
                </fieldset>
            </form>
        </div>
    </div>
</body>
</html>
