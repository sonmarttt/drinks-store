<!DOCTYPE html>
<html lang="en" data-page="login">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/loginstyles.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR
                        DECISIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1"
                        href="contact-us.html">Contact Us</a>
                    <a class="nav-link nav-button1" href="items.html">Items</a>
                    <a class="nav-link nav-button1"
                        href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                    <a class="nav-link nav-button1" href="map.html">Map</a>
                </div>
            </nav>
        </header>
    </div>
    <div class="login-div">
        <div class="login-page">
            <form>
                <div class="login-signup-nav">
                    <a id="currentPage" href="login.html">
                        <h1>Login</h1>
                    </a>
                    <h1> / </h1>
                    <a href="signup.html">
                        <h1>Sign Up</h1>
                    </a>
                </div>
                <hr class="login-hr">
                <div id="alert-message" class="alert-message"></div>
                <div class="inputbox">
                    <input type="email" id="email" name="email" required
                        class="login-input">
                    <label for="email" class="login-label">Email:</label>
                </div>
                <div class="inputbox">
                    <input type="password" id="password" name="password"
                        required class="login-input">
                    <label for="password"
                        class="login-label">Password:</label>
                </div>
                <div class="forget">
                    <label for=""><input type="checkbox">Remember Me</label>
                    <a href="#">Forget Password</a>
                </div>
                <button>Log in</button>
            </form>
        </div>
    </div>
    <script src="js/validation.js"></script>
    <script type="module">
        import { BackgroundSlider } from './js/modules/backgroundImage.js';
    
        const images = [
            'data/images/login2.jpg',
            'data/images/login1.jpg',
            'data/images/login9.jpg',
            'data/images/login4.jpg',
            'data/images/login5.jpg',

        ];
    
        BackgroundSlider(images, 3000);
 // 3 seconds interval
    </script>
</body>
</html>
