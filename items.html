<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Text+Me+One&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/itemsstyles.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR
                        DECISIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1"
                        href="#footer">Contact Us</a>
                    <a class="nav-link nav-button1  current-page"
                        href="items.html">Items</a>
                    <a class="nav-link nav-button1"
                        href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                </div>
                <div class="login-signup">
                    <a class="nav-link nav-button2" href="login.html">Login</a>
                    <a class="nav-link nav-button2" href="signup.html">Sign
                        Up</a>
                </div>
            </nav>
        </header>
        <main>
            <div class="items-page">
                <div class="filter-side-bar">
                    <h1 class="filter-title">Categories</h1>
                    <hr class="side-bar-hr">
                    <button id="btn-country" class="filter-button" for="country">Country
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button>
                    <div id="country-filter" style="display: none;"></div>
                    <button id="btn-brand" class="filter-button" for="brand">Brand
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button>
                    <div id="brand-filter" style="display: none;"></div>
                    <!-- <button id="btn-date" class="filter-button" for="date-range">Date Range
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button> -->
                    <button id="btn-price" class="filter-button" for="price-range">Price
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button>
                    <div id="price-filter" style="display: none;">
                        <div class="price-slider">
                            <input type="range" name="min-price" id="min-price" min="0" max="1000">
                            <input type="range" name="max-price" id="max-price" min="0" max="1000">
                        </div>
                        <div class="price-controls">
                            <div class="price-control-container">
                                <div class="price-control-container-label">Min</div>
                                <input type="number" name="price-control-container-input" id="price-control-container-input" value="10" min="0" max="1000">
                            </div>
                            <div class="price-control-container">
                                <div class="price-control-container-label" id="max-label">Max</div>
                                <input type="number" name="price-control-container-input" id="price-control-container-input" value="1000" min="0" max="1000">
                            </div>
                        </div>
                    </div>
                    <button id="btn-degree" class="filter-button" for="degree">Degree of Alcohol
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button>
                    <div id="degree-filter" style="display: none;">
                        <div class="degree-slider">
                            <input type="range" name="min-degree" id="min-degree" min="0" max="75">
                            <input type="range" name="max-degree" id="max-degree" min="0" max="75">
                        </div>
                        <div class="degree-controls">
                            <div class="degree-control-container">
                                <div class="degree-control-container-label">Min</div>
                                <input type="number" name="degree-control-container-input" id="degree-control-container-input" value="0" min="0" max="75">
                            </div>
                            <div class="degree-control-container">
                                <div class="degree-control-container-label" id="max-label">Max</div>
                                <input type="number" name="degree-control-container-input" id="degree-control-container-input" value="50" min="0" max="75">
                            </div>
                        </div>
                    </div>
                    <button id="btn-type" class="filter-button" for="drink-type">Drink Type
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        +</button>
                    <div id="type-filter" style="display: none;"></div>
                    <button id="btn-apply-filter">Apply Filters</button>
                </div>
                <div class="items">
                    <div id="search">
                        <input id="search-bar" type="text" placeholder="Search">
                    </div>
                    <div id="item-listing">
                        <div class="item-container">
                            <img class=drink-image src="" alt="Drink Image">
                            <a class="drink-name" href="item-detail.html">Drink
                                Name</a>
                            <p class="drink-description">Drink Type | 750ml |
                                Country</p>
                            <h1 class="drink-price">$20.00</h1>
                            <button class="add-to-cart-button">Add to
                                cart</button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer id="footer">
        <div class="footer-container">
            <!-- Empty div for spacing -->
            <div class="footer-top-space">
            
            </div>
            <img src="data/images/pngfooter.png" class="footer-floating-image">
            <div id="footer-cont" class="footer-content">
                <!-- Left Column: Brand, Links, Form -->
                <div class="footer-column footer-left">
                    <p class="footer-header">POUR DECISIONS</p>
                    <div class="footer-main-links">
                        <a class="footer-nav-link" href="index.html">Home</a>
                        <a class="footer-nav-link" href="contact-us.html">Contact
                            Us</a>
                        <a class="footer-nav-link" href="items.html">Items</a>
                        <a class="footer-nav-link" href="shopping-cart.html">Shopping
                            Cart</a>
                        <a class="footer-nav-link " href="faq.html">FAQ</a>
                    </div>
                    <div class="footer-form">
                        <p class="footer-form-title">Subscribe To Our
                            Newsletter</p>
                        <input type="email" placeholder="Email"
                            class="footer-input"><br>
                        <button type="submit"
                            class="footer-button">Subscribe</button>
                    </div>
                </div>
                <!-- Center Column: Image -->
                <div class="footer-column footer-center">
                    <div class="footer-social-media">
                        <i id="media-icons" class="bi bi-twitter"></i>
                        <i id="media-icons" class="bi bi-instagram"></i>
                        <i id="media-icons" class="bi bi-facebook"></i>
                    </div>
                </div>
                <!-- Right Column: Contact Info -->
                <div class="footer-column footer-right">
                    <div class="footer-info-item">
                        <i id="info-icons" class="bi bi-geo-alt-fill"></i>
                        <span class="info-text">123 Street 200</span>
                    </div>
                    <div class="footer-info-item">
                        <i id="info-icons" class="bi bi-telephone-fill"></i>
                        <span class="info-text">514 123 4567</span>
                    </div>
                    <div class="footer-info-item">
                        <i id="info-icons" class="bi bi-clock-fill"></i>
                        <span class="info-text">6AM | 2AM</span>
                    </div>
                    <div class="footer-info-item">
                        <i id="info-icons" class="bi bi-envelope-fill"></i>
                        <span class="info-text">PourDecitions@gmail.com</span>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="js/app.js" type="module" defer></script>
</body>
</html>
