<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/shoppingcartstyles.css">
</head>
<body>
    <div class="container">
        <header>
            <nav class="home-nav">
                <div class="logo">
                    <a class="nav-link nav-logo" href="index.html">POUR DECITIONS</a>
                </div>
                <div class="main-links">
                    <a class="nav-link nav-button1" href="index.html">Home</a>
                    <a class="nav-link nav-button1" href="contact-us.html">Contact Us</a>
                    <a class="nav-link nav-button1" href="items.html">Items</a>
                    <a class="nav-link nav-button1 current-page" href="shopping-cart.html">Shopping Cart</a>
                    <a class="nav-link nav-button1" href="faq.html">FAQ</a>
                </div>
                <div class="login-signup">
                    <a class="nav-link nav-button2" href="login.html">Login</a>
                    <a class="nav-link nav-button2" href="signup.html">Sign Up</a>
                </div>
            </nav>
        </header>

        <main>
            <div class="cart">

            </div>
            <div class="summary">
                <h1 id="summary-title">Summary</h1>
                <hr>
                <p class="cart-detail">Product Subtotal:</p>
                <p class="price">$0.00</p>
                <br>
                <p class="cart-detail">Taxes: <span>$0.00</span></p>
                <br>
                <p class="cart-detail">Delivery:</p>
                <input class="radio-button" type="radio" name="delivery" id="store"> 
                <p class="cart-detail radio-button-label">In Store: 1-2 business days <span>$0.00</span></p>
                <br>
                <input class="radio-button" type="radio" name="delivery" id="home"> 
                <p class="cart-detail radio-button-label">Home: 3-5 business days $0.00</p>
                <hr>
                <p class="cart-detail">Total Amount: <span>$0.00</span></p>
            </div>
        </main>
    </div>
</body>
</html>
